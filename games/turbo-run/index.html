<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04040d">
<meta name="mobile-web-app-capable" content="yes">
<title>TURBO RUN — NEON ARCADE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-background: oklch(0.145 0 0);
    --color-foreground: oklch(0.985 0 0);
    --color-card: oklch(0.205 0 0);
    --color-card-foreground: oklch(0.985 0 0);
    --color-popover: oklch(0.205 0 0);
    --color-popover-foreground: oklch(0.985 0 0);
    --color-primary: oklch(0.922 0 0);
    --color-primary-foreground: oklch(0.205 0 0);
    --color-secondary: oklch(0.269 0 0);
    --color-secondary-foreground: oklch(0.985 0 0);
    --color-muted: oklch(0.269 0 0);
    --color-muted-foreground: oklch(0.708 0 0);
    --color-accent: oklch(0.269 0 0);
    --color-accent-foreground: oklch(0.985 0 0);
    --color-destructive: oklch(0.704 0.191 22.216);
    --color-border: oklch(1 0 0 / 10%);
    --color-input: oklch(1 0 0 / 15%);
    --color-ring: oklch(0.556 0 0);
    --radius-lg: 0.625rem;
    --radius-md: 0.375rem;
    --radius-sm: 0.1875rem;
  }
</style>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04040d; color:#fff;
    overflow:hidden; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  #root { position:fixed; inset:0; }
  .boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:0.35em; color:#22d3ee; font-size:12px; background:#04040d; }
  .boot .bar { width:200px; height:3px; background:#0b3c46; border-radius:3px; overflow:hidden; }
  .boot .bar i { display:block; height:100%; width:45%;
    background:linear-gradient(90deg,#22d3ee,#a855f7); border-radius:3px;
    animation:bootslide 1.1s ease-in-out infinite; }
  @keyframes bootslide { 0%{transform:translateX(-110%)} 100%{transform:translateX(320%)} }
</style>
</head>
<body>
<div id="root">
  <div class="boot"><div>LOADING GAME…</div><div class="bar"><i></i></div></div>
</div>
<script type="module" src="./turbo-run.js"></script>
</body>
</html>
